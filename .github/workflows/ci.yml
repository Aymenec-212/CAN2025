name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, "feat/*", "fix/*" ]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    services:
      # 1. Postgres Service
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Health check to ensure DB is ready before steps run
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # 2. Redis Service
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      # 3. Setup uv (The Astral tool)
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-suffix: "py3.11" # Optional: distinct cache per python version

      # 4. Setup Python via uv
      - name: Set up Python
        run: uv python install 3.11

      # 5. Install Dependencies (The Fix!)
      # This reads uv.lock/pyproject.toml and installs everything properly
      - name: Install dependencies
        run: uv sync --all-extras --dev

      # 6. Linting
      - name: Lint with Ruff
        run: uv run ruff check .

      # 7. Type Checking
      - name: Type check with Mypy
        run: uv run mypy app

      # 8. Run Migrations (Verify Alembic works)
      - name: Run Migrations Check
        run: uv run alembic upgrade head
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
          POSTGRES_PORT: 5432
          # MISSING VAR ADDED HERE:
          REDIS_HOST: localhost
          LLM_API_KEY: "mock-key-ci"

